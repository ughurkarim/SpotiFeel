<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SpotiFeel Wrapped Anytime product preview</title>
  <desc id="desc">A stylized preview of the Wrapped Anytime dashboard with a share card, listening personality, discovery score, top artists, top songs, and genre chart.</desc>
  <defs>
